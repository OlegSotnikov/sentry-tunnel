default:
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:1.25

stages:
  - build
  - dockerize
  - validate
  - cleanup

# Shared cache configuration
.go-cache: &go-cache
  cache:
    paths:
      - .cache
  before_script:
    - mkdir -p .cache
    - export GOPATH="$CI_PROJECT_DIR/.cache"

############  TEST & BUILD (parallel on master/staging)  #########################

unit-test:
  <<: *go-cache
  stage: build
  needs: []
  script:
    - go install gotest.tools/gotestsum@latest
    - $GOPATH/bin/gotestsum --junitfile report.xml --format testdox -- -race -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - report.xml
      - coverage.out
    expire_in: 1 week
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "staging"

golangci-lint:
  stage: build
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golangci/golangci-lint:latest-alpine
  cache: []
  needs: []
  before_script:
    - apk add --no-cache git bash jq
  script:
    golangci-lint run --timeout=5m --out-format code-climate --no-config --issues-exit-code=0 --max-same-issues=0 --allow-parallel-runners --disable-all -E revive,govet,staticcheck,errcheck,gosimple,exportloopref,gocritic,goconst |
    tee "gl-code-quality-report.json" |
    jq -r '.[] | "\(.location.path):\(.location.lines.begin) \(.description)"'
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"
  timeout: 10 minutes
  retry:
    max: 2
    when:
      - runner_system_failure

########### BUILD ###############

.build-template: &build-template
  <<: *go-cache
  stage: build
  script:
    - export CGO_ENABLED=0
    - export VERSION=${CI_COMMIT_SHORT_SHA}
    - export FILE_NAME=./bin_${GOARCH}/sentry-tunnel
    - go mod tidy
    - go build -gcflags "all=-trimpath=${CI_PROJECT_DIR}" -ldflags "-s -w -X main.version=$VERSION" -o $FILE_NAME sentry-tunnel.go
  artifacts:
    paths:
      - bin_${GOARCH}/

build-mr-linux-amd64:
  <<: *build-template
  needs: []
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"
  variables:
    GOOS: linux
    GOARCH: amd64
  artifacts:
    expire_in: 1 day

build-stag-linux-amd64:
  <<: *build-template
  needs: []
  environment: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  variables:
    GOOS: linux
    GOARCH: amd64

build-stag-linux-arm64:
  <<: *build-template
  needs: []
  environment: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  variables:
    GOOS: linux
    GOARCH: arm64

build-prod-linux-amd64:
  <<: *build-template
  needs: []
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  variables:
    GOOS: linux
    GOARCH: amd64

build-prod-linux-arm64:
  <<: *build-template
  needs: []
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  variables:
    GOOS: linux
    GOARCH: arm64

##################### DOCKERIZE ######################

.create-dockerfile: &create-dockerfile
  - |
    cat <<EOT > Dockerfile
    FROM scratch

    COPY ./zoneinfo /usr/share/zoneinfo
    COPY ./ca-certificates.crt /etc/ssl/certs/

    ENV TZ=UTC

    ARG TARGETARCH
    COPY ./bin_\${TARGETARCH}/sentry-tunnel /app/sentry-tunnel

    WORKDIR /app/

    USER 65532:65532

    CMD ["/app/sentry-tunnel"]

    EOT

.docker-job: &docker-job
  stage: dockerize
  tags:
    - dockerbuilder
  script:
    - *create-dockerfile
    - cp -r /usr/share/zoneinfo ${CI_PROJECT_DIR}/zoneinfo
    - cp /etc/ssl/certs/ca-certificates.crt ${CI_PROJECT_DIR}/ca-certificates.crt
    - docker login -u ${DOCKER_HUB_LOGIN} -p ${DOCKER_HUB_TOKEN}
    - docker buildx build --platform linux/amd64,linux/arm64 --sbom=true --provenance=true -t ${PR_DOCKER_HUB_REPOSITORY}:${CI_COMMIT_BRANCH}-${CI_COMMIT_SHORT_SHA} -t ${PR_DOCKER_HUB_REPOSITORY}:${CI_COMMIT_BRANCH}-latest --push . --progress=plain
    - docker logout

dockerize-staging:
  <<: *docker-job
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  environment: staging
  resource_group: staging
  variables:
    GIT_STRATEGY: none
  needs:
    - job: unit-test
    - job: build-stag-linux-amd64
      artifacts: true
    - job: build-stag-linux-arm64
      artifacts: true

dockerize-production:
  <<: *docker-job
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  environment: production
  resource_group: production
  variables:
    GIT_STRATEGY: none
  needs:
    - job: unit-test
    - job: build-prod-linux-amd64
      artifacts: true
    - job: build-prod-linux-arm64
      artifacts: true

##################### SECURITY SCANNING ######################

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Code-Quality.gitlab-ci.yml

gemnasium-dependency_scanning:
  stage: build
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"

variables:
  DS_REMEDIATE: "false"
  DS_MAX_DEPTH: -1

code_quality:
  stage: build
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"

semgrep-sast:
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"

sast:
  stage: build
  variables:
    SEARCH_MAX_DEPTH: '6'

container_scanning:
  stage: validate
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "staging"
  variables:
    CS_IMAGE: docker.io/${PR_DOCKER_HUB_REPOSITORY}:${CI_COMMIT_BRANCH}-latest
    CS_REGISTRY_USER: ${DOCKER_HUB_LOGIN}
    CS_REGISTRY_PASSWORD: ${DOCKER_HUB_TOKEN}

##################### CLEANUP ######################

clean:
  stage: cleanup
  tags:
    - dockerbuilder
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  before_script: []
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "staging"
  script:
    - echo "Time to clean up"
  after_script:
    - docker image prune -a -f
    - docker builder prune -a -f
    - cd ..
    - echo "Cleaning ${CI_PROJECT_DIR}"
    - rm -rf $CI_PROJECT_DIR
    - rm -rf ${CI_PROJECT_DIR}.tmp
