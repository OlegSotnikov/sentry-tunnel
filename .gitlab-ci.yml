default:
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:1.25

stages:
  - test
  - build
  - dockerize
  - validate
  - cleanup

.go-cache: &go-cache
  cache:
    paths:
      - .cache
  before_script:
    - mkdir -p .cache
    - export GOPATH="$CI_PROJECT_DIR/.cache"

############  TEST & BUILD (parallel on master)  #########################

unit-test:
  <<: *go-cache
  stage: build
  needs: []
  script:
    - go install gotest.tools/gotestsum@latest
    - $GOPATH/bin/gotestsum --junitfile report.xml --format testdox -- -race -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - report.xml
      - coverage.out
    expire_in: 1 week
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    - if: $CI_COMMIT_BRANCH == "master"

########### BUILD ###############

.build-template: &build-template
  <<: *go-cache
  stage: build
  script:
    - export CGO_ENABLED=0
    - export VERSION=${CI_COMMIT_SHORT_SHA}
    - export FILE_NAME=./bin_${GOARCH}/sentry-tunnel
    - go mod tidy
    - go build -gcflags "all=-trimpath=${CI_PROJECT_DIR}" -ldflags "-s -w -X main.version=$VERSION" -o $FILE_NAME sentry-tunnel.go
  artifacts:
    paths:
      - bin_${GOARCH}/

build-mr-linux-amd64:
  <<: *build-template
  needs: []
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
  variables:
    GOOS: linux
    GOARCH: amd64
  artifacts:
    expire_in: 1 day

build-linux-amd64:
  <<: *build-template
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  variables:
    GOOS: linux
    GOARCH: amd64

build-linux-arm64:
  <<: *build-template
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  variables:
    GOOS: linux
    GOARCH: arm64

##################### DOCKERIZE ######################

.create-dockerfile: &create-dockerfile
  - |
    cat <<EOT > Dockerfile
    FROM scratch

    COPY ./zoneinfo /usr/share/zoneinfo
    COPY ./ca-certificates.crt /etc/ssl/certs/

    ENV TZ=UTC

    ARG TARGETARCH
    COPY ./bin_\${TARGETARCH}/sentry-tunnel /app/sentry-tunnel

    WORKDIR /app/

    USER 65532:65532

    CMD ["/app/sentry-tunnel"]

    EOT

dockerize:
  stage: dockerize
  tags:
    - dockerbuilder
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  variables:
    GIT_STRATEGY: none
  needs:
    - job: unit-test
    - job: build-linux-amd64
      artifacts: true
    - job: build-linux-arm64
      artifacts: true
  script:
    - *create-dockerfile
    - cp -r /usr/share/zoneinfo ${CI_PROJECT_DIR}/zoneinfo
    - cp /etc/ssl/certs/ca-certificates.crt ${CI_PROJECT_DIR}/ca-certificates.crt
    - docker login -u ${DOCKER_HUB_LOGIN} -p ${DOCKER_HUB_TOKEN}
    - docker buildx build --platform linux/amd64,linux/arm64 --sbom=true --provenance=true -t ${PR_DOCKER_HUB_REPOSITORY}:${CI_COMMIT_SHORT_SHA} -t ${PR_DOCKER_HUB_REPOSITORY}:latest --push . --progress=plain
    - docker logout

##################### SECURITY SCANNING ######################

include:
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

variables:
  DS_REMEDIATE: "false"
  DS_MAX_DEPTH: -1

gemnasium-dependency_scanning:
  stage: build
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"

container_scanning:
  stage: validate
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  variables:
    CS_IMAGE: docker.io/${PR_DOCKER_HUB_REPOSITORY}:latest
    CS_REGISTRY_USER: ${DOCKER_HUB_LOGIN}
    CS_REGISTRY_PASSWORD: ${DOCKER_HUB_TOKEN}

##################### CLEANUP ######################

clean:
  stage: cleanup
  tags:
    - dockerbuilder
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  before_script: []
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  script:
    - echo "Time to clean up"
  after_script:
    - docker image prune -a -f
    - docker builder prune -a -f
    - cd ..
    - echo "Cleaning ${CI_PROJECT_DIR}"
    - rm -rf $CI_PROJECT_DIR
    - rm -rf ${CI_PROJECT_DIR}.tmp
